# -----------------------------------------------
# Ongo
# No crates from outside this project. The standard
# library is the only dependency.
# -----------------------------------------------

[package]
name = "ongo"
version = "0.1.3"
edition = "2021"
description = "A small, fast Django-style web framework for the backend and the frontend. Routes, views, templates, static files, and one HTTP server."
license = "MIT OR Apache-2.0"
repository = "https://github.com/uoxone/ongo"
readme = "README.md"
homepage = "https://uoxone.github.io/ongo/"

# -----------------------------------------------
# crates.io
# Categories place OnGo on the web-framework lists.
# Keywords are the words people search for.
# -----------------------------------------------

categories = [
    "web-programming",
    "web-programming::http-server",
    "network-programming",
]
keywords = ["web", "framework", "django", "backend", "frontend"]

# -----------------------------------------------
# Layout
# core/src is the framework and the ongo command.
# core/templates is the blueprint for a new project.
# -----------------------------------------------

[lib]
name = "ongo"
path = "core/src/lib.rs"

[[bin]]
name = "ongo"
path = "core/src/main.rs"

# Release builds one optimized binary. Copy that file
# to a server and run it; cargo is not needed there.
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
